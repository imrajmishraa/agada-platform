name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@agada/shared

      - name: Run Node.js tests
        run: npm run test

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r packages/backend/triage-service/requirements.txt
          pip install -r packages/backend/analytics-service/requirements.txt

      - name: Run Triage tests
        run: |
          cd packages/backend/triage-service
          pytest

      - name: Run Analytics tests
        run: |
          cd packages/backend/analytics-service
          pytest
