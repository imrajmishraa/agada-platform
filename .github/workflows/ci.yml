# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  # Node.js services
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build shared package
        run: npm run build --filter=@agada/shared
      
      - name: Run Node.js tests
        run: npm run test -- --filter=!@agada/triage-service --filter=!@agada/analytics-service

  # Python services
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          pip install -r packages/backend/triage-service/requirements.txt
          pip install -r packages/backend/analytics-service/requirements.txt
      
      - name: Run Python tests
        run: |
          cd packages/backend/triage-service
          pytest
      
      - name: Run Analytics tests
        run: |
          cd packages/backend/analytics-service
          pytest